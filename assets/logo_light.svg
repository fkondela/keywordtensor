<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 500" width="100%" height="100%">
  <defs>
    
  <linearGradient id="smoothGrad" x1="0" y1="0" x2="650" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#5F18EB"/>
    <stop offset="50%" stop-color="#9F5DE2"/>
    <stop offset="100%" stop-color="#F78E5A"/>
  </linearGradient>

    
  <mask id="node-mask">
    <rect width="100%" height="100%" fill="white" />
    <circle cx="300" cy="250" r="48" fill="black" />
    <circle cx="450" cy="100" r="48" fill="black" />
    <circle cx="450" cy="250" r="48" fill="black" />
    <circle cx="450" cy="400" r="48" fill="black" />
    <circle cx="600" cy="150" r="48" fill="black" />
    <circle cx="600" cy="350" r="48" fill="black" />
  </mask>

  </defs>
  <g transform="translate(8, 0)">
    
  <g mask="url(#node-mask)" fill="none" stroke="url(#smoothGrad)">
    <!-- Asymmetrical Waveform (Small -> Large -> Med) -->
    <path d="M 100 250 
             L 100 180 
             A 20 20 0 0 1 140 180 
             L 140 320 
             A 20 20 0 0 0 180 320 
             L 180 80 
             A 20 20 0 0 1 220 80 
             L 220 420 
             A 20 20 0 0 0 260 420 
             L 260 130 
             A 20 20 0 0 1 300 130 
             L 300 250" 
          stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Network Lines -->
    <g stroke-width="12" stroke-linecap="round">
      <line x1="300" y1="250" x2="450" y2="100" />
      <line x1="300" y1="250" x2="450" y2="250" />
      <line x1="300" y1="250" x2="450" y2="400" />
      
      <!-- Layer 2 to 3 -->
      <line x1="450" y1="100" x2="600" y2="150" />
      <line x1="450" y1="100" x2="600" y2="350" />
      <line x1="450" y1="250" x2="600" y2="150" />
      <line x1="450" y1="250" x2="600" y2="350" />
      <line x1="450" y1="400" x2="600" y2="150" />
      <line x1="450" y1="400" x2="600" y2="350" />
    </g>
  </g>

  <!-- Network Rings -->
  <g fill="none" stroke="url(#smoothGrad)" stroke-width="24">
    <circle cx="300" cy="250" r="35" />
    <circle cx="450" cy="100" r="35" />
    <circle cx="450" cy="250" r="35" />
    <circle cx="450" cy="400" r="35" />
    <circle cx="600" cy="150" r="35" />
    <circle cx="600" cy="350" r="35" />
  </g>

  </g>
  <text x="762" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="240" font-weight="800" fill="#111827" letter-spacing="-5">KeywordTensor</text>
</svg>